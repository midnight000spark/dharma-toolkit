include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # W18: «запущенный и забытый» future — это молчаливое действие. Линты
    # подняты до уровня ошибки, чтобы analyze ловил такие места, а не
    # пользователь в рантайме.
    discarded_futures: error
    unawaited_futures: error
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - discarded_futures
    - unawaited_futures
